services:
  postgres:
    image: postgres:18-alpine
    container_name: analyzer_postgres
    environment:
      POSTGRES_DB: security_log_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sla_dev_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d security_log_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis
    container_name: analyzer_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: