services:
  app:
    build: .
    container_name: analyzer_app
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/security_log_analyzer
      DB_USER: postgres
      DB_PASSWORD: "@VishalData"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    container_name: analyzer_postgres
    environment:
      POSTGRES_DB: security_log_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "@VishalData"
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d security_log_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis
    container_name: analyzer_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata: