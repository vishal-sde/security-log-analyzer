<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Signal — Security Log Analyzer</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="console-header">
    <div class="brand">
        <span class="brand-mark">◆</span>
        <div>
            <h1>SIGNAL</h1>
            <div class="brand-sub">security log analyzer</div>
        </div>
    </div>
    <div class="header-right">
        <div class="live-indicator"><span class="pulse-dot" aria-hidden="true"></span>Live — refreshes every 5s</div>
        <button id="seedBtn" class="seed-btn">Run attack scenario</button>
    </div>
</header>

<section class="stat-strip" id="statStrip" aria-label="Summary statistics"></section>

<section class="timeline-section">
    <div class="timeline-label">Recent alert activity</div>
    <div class="timeline-strip" id="timelineStrip"></div>
</section>

<main class="console-grid">
    <section class="panel panel-alerts">
        <div class="panel-header">
            <h2>Incidents</h2>
            <div class="panel-tools">
                <select id="statusFilter" class="filter-select" aria-label="Filter incidents">
                    <option value="active">Active</option>
                    <option value="all">All</option>
                </select>
                <span class="panel-meta" id="alertCount"></span>
            </div>
        </div>
        <div class="table-wrap">
            <table class="log-table">
                <thead>
                <tr><th>Last seen</th><th>Source IP</th><th>User</th><th>Rules</th><th>Hits</th><th>Score</th><th>Severity</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="alertsBody"></tbody>
            </table>
        </div>
    </section>

    <aside class="panel panel-ips">
        <div class="panel-header"><h2>Top source IPs</h2></div>
        <div class="ip-list" id="topIps"></div>
    </aside>
</main>

<footer class="console-footer" id="lastUpdated"></footer>

<script src="app.js"></script>
</body>
</html>
